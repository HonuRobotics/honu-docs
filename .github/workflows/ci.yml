# CI for the shared documentation tooling. Three layers:
#   test     unit tests plus a fixture consumer built end to end
#   dogfood  this repository's own docs built and deployed through the
#            reusable workflow, exercising it for real
#   the weekly schedule reruns the tests against freshly resolved
#   dependencies to catch new Sphinx, theme or MyST releases early

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Installed non editable on purpose: an editable install would mask
      # static assets or templates missing from the built wheel.
      - name: Install
        run: pip install . pytest

      - name: Test
        run: pytest -q

  dogfood:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
    with:
      default_version: main
