[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-honu"
version = "0.1.0"
description = "Honu Robotics documentation house style: docs.ros.org functionality, Honu branding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
  "myst-parser>=2",
]

[project.scripts]
honu-docs-deploy = "sphinx_honu.deploy:main"

[tool.setuptools]
packages = ["sphinx_honu"]

[tool.setuptools.package-data]
sphinx_honu = ["static/*", "templates/*"]
